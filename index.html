<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DustifyAIO Guide</title>
    <link rel="icon" href="assets/logo.jpg" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0c0f;
        --panel: #12141a;
        --border: #2a3040;
        --text: #eef1f6;
        --muted: #8b93a7;
        --accent: #3dd68c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "DM Sans", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            ellipse at 30% 20%,
            rgba(61, 214, 140, 0.16),
            transparent 55%
          ),
          radial-gradient(
            ellipse at 80% 80%,
            rgba(110, 168, 255, 0.1),
            transparent 50%
          ),
          var(--bg);
      }
      .card {
        width: min(440px, calc(100vw - 32px));
        padding: 36px 28px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(18, 20, 26, 0.92);
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.45;
      }
      .langs {
        display: grid;
        gap: 10px;
      }
      a {
        display: block;
        padding: 14px 16px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        border: 1px solid var(--border);
        color: var(--text);
        background: #171a21;
        transition: border-color 0.15s, transform 0.15s;
      }
      a:hover {
        border-color: var(--accent);
        transform: translateY(-1px);
      }
      a.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #0b0c0f;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="assets/logo.jpg" alt="DustifyAIO" />
      <h1>DustifyAIO Guide</h1>
      <p>Oficiální členský návod / Official member guide</p>
      <div class="langs">
        <a class="primary" href="cs/">Česky</a>
        <a href="en/">English</a>
      </div>
    </div>
  </body>
</html>
