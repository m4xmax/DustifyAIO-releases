<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DustifyAIO Guide</title>
    <link rel="icon" href="assets/logo.jpg" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0c0f;
        --panel: #171a21;
        --border: #2a3040;
        --text: #eef1f6;
        --muted: #8b93a7;
        --accent: #3dd68c;
        --accent-dim: rgba(61, 214, 140, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "DM Sans", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            ellipse 80% 60% at 50% -10%,
            rgba(61, 214, 140, 0.14),
            transparent 55%
          ),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: min(380px, calc(100vw - 32px));
        padding: 40px 28px 28px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(18, 20, 26, 0.94);
        text-align: center;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        margin-bottom: 18px;
        object-fit: cover;
      }
      h1 {
        margin: 0 0 28px;
        font-size: 1.45rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .langs {
        display: grid;
        gap: 10px;
      }
      a {
        display: block;
        padding: 13px 16px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
        border: 1px solid var(--border);
        color: var(--text);
        background: var(--panel);
        transition: border-color 0.15s ease, background 0.15s ease,
          transform 0.15s ease;
      }
      a:hover {
        border-color: var(--accent);
        background: var(--accent-dim);
        transform: translateY(-1px);
      }
      a.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #0b0c0f;
      }
      a.primary:hover {
        background: #4ae09a;
        border-color: #4ae09a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="assets/logo.jpg" alt="DustifyAIO" />
      <h1>DustifyAIO</h1>
      <div class="langs">
        <a class="primary" href="cs/">Czech</a>
        <a href="en/">English</a>
      </div>
    </div>
  </body>
</html>
