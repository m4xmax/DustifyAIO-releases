<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>DustifyAIO Guide</title>
    <link rel="icon" href="../assets/logo.jpg" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/theme.css?v=8" />
  </head>
  <body>
    <div class="lang-switch">
      <a href="https://m4xmax.github.io/DustifyAIO-releases/cs/">Czech</a>
      <a class="active" href="https://m4xmax.github.io/DustifyAIO-releases/en/">English</a>
    </div>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: "DustifyAIO",
        nameLink: "./",
        logo: "../assets/logo.jpg",
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        homepage: "README.md",
        search: {
          placeholder: "Search…",
          noData: "No results",
          depth: 3,
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script>
      document.querySelectorAll(".lang-switch a").forEach(function (a) {
        a.addEventListener(
          "click",
          function (e) {
            e.preventDefault();
            e.stopImmediatePropagation();
            window.location.href = a.href;
          },
          true
        );
      });
    </script>
  </body>
</html>
